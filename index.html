<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>L'Aquarium</title>
    <link rel="stylesheet" href="/style/style.css" />
    <script>
        // Forcer le scroll en haut au chargement de la page
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.addEventListener('beforeunload', function () {
            window.scrollTo(0, 0);
        });
    </script>
</head>

<body>
    <!-- Section d'accueil fullscreen -->
    <section id="hero" class="hero-section">
        <div id="ocean"></div>
        <div class="hero-content">
            <div class="logo">
                <h1>Aquascope</h1>
                <img src="/assets/images/bulle.svg">
            </div>
            <h2 class="hero-subtitle">Venez explorer les fonds-marins</h2>
            <a href="#aquarium" class="btn-discover">Découvrir</a>
        </div>

    </section>

    <!-- Section de l'aquarium -->
    <section id="aquarium" class="aquarium-section">
        <!-- Contrôle jour/nuit -->
        <div class="time-control">
            <label for="timeSlider">
                <span class="time-icon">☀️</span>
                <input type="range" id="timeSlider" min="0" max="100" value="50" step="1">
                <span class="time-icon">🌙</span>
            </label>
            <span id="timeLabel" class="time-label">Jour</span>
        </div>

        <!-- Bouton Bioluminescence -->
        <button id="bioBtn" class="bio-button" title="Mode Bioluminescence">
            <span class="bio-icon">✨</span>
            <span class="bio-text">Bioluminescence</span>
        </button>

        <div style="position:relative">
            <canvas id="renderCanvas"></canvas>

        <div id="infoBox" class="hidden">
            <h3 id="infoTitle"></h3>
            <p id="infoText"></p>
            <div class="infoBox-buttons">
                <button id="btnAnimation" class="btn-hotspot">Animation</button>
            </div>
        </div>
    </section>

    <!-- Babylon core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <!-- Loader pour .glb -->
    <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>

    <!-- Textures procédurales -->
    <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>

    <!-- Babylon GUI -->
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

    <script>
        // Scroll vers le haut au chargement
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
            }, 0);
        });
    </script>

    <script type="module" src="./src/main.js"></script>
    <script src="./src/animation_homepage.js"></script>
</body>

</html>
